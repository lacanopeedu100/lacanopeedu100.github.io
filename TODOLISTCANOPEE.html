}

.text-\[var\(--bg\)\] {
  color: var(--bg);
}

.text-\[var\(--text\)\] {
  color: var(--text);
}

.text-\[var\(--text-faint\)\] {
  color: var(--text-faint);
}

.text-\[var\(--text-muted\)\] {
  color: var(--text-muted);
}

.line-through {
  text-decoration-line: line-through;
}

.opacity-0 {
  opacity: 0;
}

.shadow-\[0_1px_0_0_var\(--border\)\] {
  --tw-shadow: 0 1px 0 0 var(--border);
  --tw-shadow-colored: 0 1px 0 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline {
  outline-style: solid;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur-sm {
  --tw-backdrop-blur: blur(4px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-opacity {
  transition-property: opacity;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg: #FEFCF8;
  --surface: #FFFFFF;
  --surface-2: #FDF6E9;
  --border: #E8E0D0;
  --border-strong: #D9D0BC;
  --text: #1A1A18;
  --text-muted: #8A8275;
  --text-faint: #B8B0A0;
  --accent: #11110F;
  --check: #1A1A18;
  --focus: #E8DCC2;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #12110E;
    --surface: #1C1B18;
    --surface-2: #25221E;
    --border: #2E2B27;
    --border-strong: #3A3732;
    --text: #F0EBE0;
    --text-muted: #9A958C;
    --text-faint: #6B6760;
    --accent: #F0EBE0;
    --check: #F0EBE0;
    --focus: #3A3528;
  }
}

html,body{
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}

::-moz-selection{
  background: var(--focus);
}

::selection{
  background: var(--focus);
}

.placeholder\:text-\[var\(--text-faint\)\]::-moz-placeholder {
  color: var(--text-faint);
}

.placeholder\:text-\[var\(--text-faint\)\]::placeholder {
  color: var(--text-faint);
}

.hover\:border-\[var\(--border\)\]:hover {
  border-color: var(--border);
}

.hover\:border-\[var\(--border-strong\)\]:hover {
  border-color: var(--border-strong);
}

.hover\:bg-\[var\(--bg\)\]:hover {
  background-color: var(--bg);
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

.hover\:opacity-90:hover {
  opacity: 0.9;
}

.focus\:border-solid:focus {
  border-style: solid;
}

.focus\:border-\[var\(--border-strong\)\]:focus {
  border-color: var(--border-strong);
}

.peer:checked ~ .peer-checked\:border-\[var\(--text\)\] {
  border-color: var(--text);
}

.peer:checked ~ .peer-checked\:bg-\[var\(--text\)\] {
  background-color: var(--text);
}

.peer:checked ~ .peer-checked\:opacity-100 {
  opacity: 1;
}

@media (min-width: 640px) {
  .sm\:inline-flex {
    display: inline-flex;
  }

  .sm\:max-w-none {
    max-width: none;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:gap-2 {
    gap: 0.5rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-7 {
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:text-\[12px\] {
    font-size: 12px;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .lg\:col-span-4 {
    grid-column: span 4 / span 4;
  }

  .lg\:col-span-5 {
    grid-column: span 5 / span 5;
  }

  .lg\:w-auto {
    width: auto;
  }

  .lg\:grid-cols-1 {
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:justify-end {
    justify-content: flex-end;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
